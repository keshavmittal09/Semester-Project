services:
  - type: web
    name: medai-backend
    env: python
    region: oregon
    buildCommand: "cd backend && pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.12
